name: neat_now
description: NeatNow - Waste Management App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.4
  geolocator: ^11.0.1
  permission_handler: ^11.0.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^4.0.4
  fluttertoast: ^8.2.2
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/