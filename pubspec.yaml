name: neat_now
description: NeatNow - Waste Management App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.0
  cupertino_icons: ^1.0.2
  http: ^1.6.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  shared_preferences: ^2.5.3
  google_fonts: ^4.0.4
  fluttertoast: ^8.2.2
  lottie: ^2.7.0
  geocoding: ^2.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.4
  provider: ^6.1.1      # Add this line

  geolocator: ^10.1.0  # Latest stable version
  # Update other plugins too:
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  firebase_analytics: ^12.1.0
  device_info_plus: ^11.3.0
  # ... rest of your dependencies

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/fyp_video.mp4



