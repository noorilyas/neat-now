name: neat_now
description: NeatNow - Waste Management App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.4
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.3.3
  fluttertoast: ^9.0.0
  lottie: ^3.3.2
  provider: ^6.0.5
  video_player: ^2.6.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.1.10
  geocoding: ^4.0.0
  google_places_flutter: ^2.0.9
  google_maps_flutter: ^2.5.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/